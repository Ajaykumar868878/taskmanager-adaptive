{% extends "base.html" %}
{% block title %}Sign Up - Smart Task{% endblock %}
{% block content %}
<div class="text-center mb-3">
    <a href="{{ url_for('index') }}" class="text-decoration-none fw-semibold" style="color:var(--primary-dark);">
        <i class="bi bi-arrow-left me-1"></i> Back to Home
    </a>
</div>
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <div class="d-inline-flex align-items-center justify-content-center mb-3" style="width:72px;height:72px;border-radius:22px;background:linear-gradient(135deg,var(--primary-light),var(--accent));box-shadow:0 8px 24px rgba(0,172,193,0.25);">
                    <i class="bi bi-person-plus-fill text-white" style="font-size: 2rem;"></i>
                </div>
                <h3 class="fw-bold">Create Account</h3>
                <p class="text-muted">Join your team's workspace</p>
            </div>
            <form method="POST" action="{{ url_for('signup') }}">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                        <input type="email" name="email" class="form-control" placeholder="Enter email" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="Create password" required>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Role</label>
                    <select name="role" class="form-select" disabled>
                        <option value="member">Member</option>
                    </select>
                    <input type="hidden" name="role" value="member">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">Create Account</button>
            </form>
            <hr class="my-4">
            <p class="text-center text-muted mb-0">Already have an account? <a href="{{ url_for('login') }}" class="text-decoration-none fw-semibold">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
