{% extends "base.html" %}
{% block title %}Settings - Smart Task{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
    <div class="page-header mb-0">
        <h2 class="mb-1">Settings</h2>
        <p class="mb-0">Manage your account and preferences</p>
    </div>
</div>

<div class="row g-3">
    <!-- Profile Card -->
    <div class="col-lg-6">
        <div class="card p-4 animate-fade-up">
            <h5 class="section-title mb-4"><i class="bi bi-person-circle text-primary me-1"></i>Personal Information</h5>
            <form method="POST" action="{{ url_for('settings') }}">
                <input type="hidden" name="action" value="profile">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" class="form-control" value="{{ user.username }}" disabled>
                    <small class="text-muted">Username cannot be changed</small>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Role</label>
                    <input type="text" class="form-control" value="{{ user.role|capitalize }}" disabled>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Member Since</label>
                    <input type="text" class="form-control" value="{{ user.created_at.strftime('%b %d, %Y') if user.created_at else 'N/A' }}" disabled>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Password Card -->
    <div class="col-lg-6">
        <div class="card p-4 animate-fade-up" style="animation-delay: 0.1s;">
            <h5 class="section-title mb-4"><i class="bi bi-shield-lock text-danger me-1"></i>Change Password</h5>
            <form method="POST" action="{{ url_for('settings') }}">
                <input type="hidden" name="action" value="password">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Current Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                        <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key"></i></span>
                        <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Confirm New Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light"><i class="bi bi-key-fill"></i></span>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                    </div>
                </div>
                <div class="d-flex justify-content-end">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-arrow-repeat me-1"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
