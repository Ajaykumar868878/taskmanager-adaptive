{% extends "base.html" %}
{% block title %}Settings - Smart Task{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="page-header mb-4">
            <h2 class="mb-1">Settings</h2>
            <p class="mb-0">Manage your account and preferences</p>
        </div>

        <div class="card p-4 mb-4">
            <h5 class="section-title mb-4"><i class="bi bi-person-circle text-primary me-2"></i>Personal Information</h5>
            <form method="POST" action="{{ url_for('settings') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Username</label>
                        <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        <small class="text-muted">Username cannot be changed</small>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Role</label>
                        <input type="text" class="form-control" value="{{ user.role|capitalize }}" disabled>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email or '' }}" required>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" name="action" value="update_profile">
                        <i class="bi bi-check-lg me-1"></i> Save Changes
                    </button>
                </div>
            </form>
        </div>

        <div class="card p-4">
            <h5 class="section-title mb-4"><i class="bi bi-shield-lock text-danger me-2"></i>Change Password</h5>
            <form method="POST" action="{{ url_for('settings') }}">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Current Password</label>
                        <input type="password" name="current_password" class="form-control" placeholder="Enter current password" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">New Password</label>
                        <input type="password" name="new_password" class="form-control" placeholder="Enter new password" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Confirm New Password</label>
                        <input type="password" name="confirm_password" class="form-control" placeholder="Confirm new password" required>
                    </div>
                </div>
                <div class="mt-4">
                    <button type="submit" class="btn btn-primary" name="action" value="change_password">
                        <i class="bi bi-key me-1"></i> Update Password
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
